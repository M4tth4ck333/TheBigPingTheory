- name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
- name: Run MATLAB Tests
  # You may pin to the exact commit or the version.
  # uses: matlab-actions/run-tests@214a16e600ef2c705a4b2dd6c0794dc6957682a9
  uses: matlab-actions/run-tests@v3.3.0
  with:
    # Location of the folder containing source code
    source-folder: # optional, default is 
    # Whether to apply strict checks when running the tests.

    strict: # optional
    # Whether to run tests in parallel
    use-parallel: # optional
    # Display level for event details produced by the test run

    output-detail: # optional, default is 
    # Maximum verbosity level for logged diagnostics included for the test run

    logging-level: # optional, default is 
    # Location of the folder containing test files
    select-by-folder: # optional, default is 
    # Test tag used to select test suite elements
    select-by-tag: # optional, default is 
    # File path to write test results in PDF format
    test-results-pdf: # optional, default is 
    # Folder path to write test results in HTML format
    test-results-html: # optional, default is 
    # File path to write test results in JUnit-style XML format
    test-results-junit: # optional, default is 
    # File path to export Simulink Test Manager results in MLDATX format
    test-results-simulink-test: # optional, default is 
    # File path to write code coverage results in Cobertura XML format
    code-coverage-cobertura: # optional, default is 
    # Folder path to write code coverage results in HTML format
    code-coverage-html: # optional, default is 
    # File path to write model coverage results in Cobertura XML format
    model-coverage-cobertura: # optional, default is 
    # Folder path to write model coverage results in HTML format
    model-coverage-html: # optional, default is 
    # Startup options for MATLAB
    startup-options: # optional, default is 
    # Option to generate a summary for the GitHub job summary
    generate-summary: # optional, default is true
    # Code coverage metrics to collect
    code-coverage-metrics: # optional, default is auto
    # (Not recommended) Level of coverage metrics to collect
    code-coverage-metric-level: # optional, default is auto
    - name: Python Verify GitHub Action
  # You may pin to the exact commit or the version.
  # uses: EffectiveRange/python-verify-github-action@4dd34b87beabef815c81cbb2a0ea3cf20577a60f
  uses: EffectiveRange/python-verify-github-action@v1
  with:
    # Python version
    python-version: # optional, default is 3.9
    # Minimum coverage threshold
    coverage-threshold: # optional, default is 100
    # Should add PR comment with coverage summary?
    add-coverage-comment: # optional, default is true
